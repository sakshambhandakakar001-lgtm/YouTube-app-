<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sounds Studio - Flixify Pro</title>
    <style>
        body { background-color: #0f0f0f; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 16px; }
        .header { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
        .back-btn { color: #fff; text-decoration: none; font-size: 20px; }
        .sound-card { display: flex; align-items: center; justify-content: space-between; background: #1f1f1f; padding: 12px; border-radius: 8px; margin-bottom: 10px; }
        .sound-info { display: flex; flex-direction: column; gap: 4px; }
        .sound-title { font-weight: 600; font-size: 14px; }
        .sound-sub { font-size: 12px; color: #aaa; }
        .use-btn { background: #3ea6ff; color: #000; border: none; padding: 6px 14px; border-radius: 18px; font-weight: 600; font-size: 12px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="/yc" class="back-btn">&#8592;</a>
        <h2 style="margin:0;">Audio Library & Sounds</h2>
    </div>
    {% for sound in sounds %}
    <div class="sound-card">
        <div class="sound-info">
            <div class="sound-title">🎵 {{ sound.title }}</div>
            <div class="sound-sub">{{ sound.artist }} &#8226; {{ sound.duration }}</div>
            <div class="sound-sub" style="color:#2ba640;">{{ sound.shorts }}</div>
        </div>
        <button class="use-btn">Use Sound</button>
    </div>
    {% endfor %}
</body>
</html>
