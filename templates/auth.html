<!DOCTYPE html>
<html lang="hi">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flixify Pro - Welcome</title>
    <style>
        body { background:#0f0f0f; color:#fff; font-family:sans-serif; margin:0; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; box-sizing:border-box; }
        .auth-card { background:#181818; border:1px solid #282828; border-radius:16px; padding:24px; width:100%; max-width:380px; box-shadow:0 8px 24px rgba(0,0,0,0.5); }
        h2 { margin-top:0; color:#f1f1f1; font-size:22px; text-align:center; }
        .input-group { margin-bottom:14px; }
        label { font-size:12px; color:#aaa; display:block; margin-bottom:6px; }
        input { width:100%; padding:12px; background:#0f0f0f; border:1px solid #333; color:#fff; border-radius:8px; box-sizing:border-box; font-size:14px; outline:none; }
        input:focus { border-color:#3ea6ff; }
        button { width:100%; padding:12px; background:#3ea6ff; color:#000; font-weight:bold; border:none; border-radius:20px; font-size:15px; cursor:pointer; margin-top:10px; }
        .toggle-btn { text-align:center; margin-top:16px; font-size:13px; color:#aaa; cursor:pointer; }
        .toggle-btn span { color:#3ea6ff; text-decoration:underline; }
        .error-msg { color:#ff4e4e; font-size:12px; margin-bottom:10px; display:none; text-align:center; }
    </style>
</head>
<body>

<div class="auth-card">
    <h2 id="form-title">Create Account</h2>
    <div id="err-box" class="error-msg"></div>

    <form id="signup-form">
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="su-username" placeholder="Apna Username dalein" required>
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="su-password" placeholder="Password create karein" required>
        </div>
        <div class="input-group">
            <label>Email ID (Ek Email se ek hi account banega)</label>
            <input type="email" id="su-email" placeholder="example@gmail.com" required>
        </div>
        <button type="submit">Sign Up & Continue</button>
    </form>

    <form id="login-form" style="display:none;">
        <div class="input-group">
            <label>Email ID</label>
            <input type="email" id="lg-email" placeholder="Apni Email ID dalein" required>
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="lg-password" placeholder="Password dalein" required>
        </div>
        <button type="submit">Log In</button>
    </form>

    <div class="toggle-btn" id="toggle-link" onclick="toggleAuth()">
        Pehle se account hai? <span>Log In Karein</span>
    </div>
</div>

<script>
    // LocalStorage Check: Agar user pehle se registered/logged in hai toh seedhe App khologe
    if (localStorage.getItem('flixify_user_logged_in') === 'true') {
        window.location.href = '/';
    }

    let isLogin = false;

    function toggleAuth() {
        document.getElementById('err-box').style.display = 'none';
        if (isLogin) {
            document.getElementById('form-title').innerText = 'Welcome Back (Log In)';
            document.getElementById('signup-form').style.display = 'none';
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('toggle-link').innerHTML = 'Naye user ho? <span>Sign Up Karein</span>';
        } else {
            document.getElementById('form-title').innerText = 'Create Account';
            document.getElementById('signup-form').style.display = 'block';
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('toggle-link').innerHTML = 'Pehle se account hai? <span>Log In Karein</span>';
        }
    }

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errBox = document.getElementById('err-box');
        errBox.style.display = 'none';

        const username = document.getElementById('su-username').value;
        const password = document.getElementById('su-password').value;
        const email = document.getElementById('su-email').value;

        const res = await fetch('/signup', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ username, password, email })
        });
        const data = await res.json();

        if (data.success) {
            localStorage.setItem('flixify_user_logged_in', 'true');
            window.location.href = '/';
        } else {
            errBox.innerText = data.message;
            errBox.style.display = 'block';
        }
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errBox = document.getElementById('err-box');
        errBox.style.display = 'none';

        const email = document.getElementById('lg-email').value;
        const password = document.getElementById('lg-password').value;

        const res = await fetch('/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (data.success) {
            localStorage.setItem('flixify_user_logged_in', 'true');
            window.location.href = '/';
        } else {
            errBox.innerText = data.message;
            errBox.style.display = 'block';
        }
    });
</script>

</body>
</html>
