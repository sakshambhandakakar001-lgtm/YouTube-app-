<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch - Flixify Pro</title>
    <style>
        body { background: #0f0f0f; color: #fff; font-family: Roboto, Arial, sans-serif; margin: 0; padding-bottom: 70px; }
        .player-container { width: 100%; aspect-ratio: 16/9; background: #000; position: sticky; top: 0; z-index: 99; }
        video { width: 100%; height: 100%; }
        .video-meta { padding: 12px 16px; border-bottom: 1px solid #222; }
        .video-title { font-size: 18px; font-weight: bold; margin-bottom: 6px; }
        .video-stats { font-size: 12px; color: #aaa; margin-bottom: 12px; }
        .channel-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .channel-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #ff4e45; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .sub-btn { background: #fff; color: #000; border: none; padding: 8px 16px; border-radius: 18px; font-weight: bold; cursor: pointer; }
        .sub-btn.subscribed { background: #333; color: #fff; }
        .action-bar { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; }
        .action-btn { background: #272727; color: #fff; border: none; padding: 8px 14px; border-radius: 18px; font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .comments-section { padding: 16px; }
        .comment-input-box { display: flex; gap: 10px; margin-top: 10px; }
        .comment-input-box input { flex: 1; background: #121212; border: 1px solid #333; color: #fff; padding: 8px 12px; border-radius: 8px; }
        .comment-input-box button { background: #3ea6ff; color: #000; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; }
        .comment-list { margin-top: 15px; display: flex; flex-direction: column; gap: 12px; }
        .comment-item { font-size: 13px; background: #181818; padding: 8px 12px; border-radius: 8px; }
        .comment-item strong { color: #aaa; font-size: 11px; display: block; margin-bottom: 2px; }
    </style>
</head>
<body>
    <div class="player-container">
        <video controls autoplay src="/static/videos/sample.mp4"></video>
    </div>

    <div class="video-meta">
        <div class="video-title">Song - Official HD Video</div>
        <div class="video-stats">1.2K views • 2 hours ago</div>

        <div class="channel-bar">
            <div class="channel-info">
                <div class="avatar">S</div>
                <div>
                    <div style="font-weight: bold;">Saksham</div>
                    <div style="font-size: 11px; color: #aaa;">1.25K subscribers</div>
                </div>
            </div>
            <button class="sub-btn" id="subBtn" onclick="toggleSubscribe()">Subscribe</button>
        </div>

        <div class="action-bar">
            <button class="action-btn" id="likeBtn" onclick="likeVideo()">👍 <span id="likeCount">120</span></button>
            <button class="action-btn" onclick="alert('Disliked')">👎</button>
            <button class="action-btn" onclick="alert('Share link copied!')">↪ Share</button>
            <button class="action-btn" onclick="alert('Downloading...')">📥 Download</button>
        </div>
    </div>

    <div class="comments-section">
        <div style="font-weight: bold; font-size: 14px;">Comments</div>
        <div class="comment-input-box">
            <input type="text" id="commentInput" placeholder="Add a comment...">
            <button onclick="postComment()">Comment</button>
        </div>
        <div class="comment-list" id="commentList">
            <div class="comment-item"><strong>Viewer1 • 1 hour ago</strong>Awesome video! Quality is super crisp.</div>
        </div>
    </div>

    <script>
        function likeVideo() {
            let count = document.getElementById('likeCount');
            count.innerText = parseInt(count.innerText) + 1;
            fetch('/api/video/1/like', { method: 'POST' });
        }
        function toggleSubscribe() {
            let btn = document.getElementById('subBtn');
            btn.classList.toggle('subscribed');
            btn.innerText = btn.classList.contains('subscribed') ? 'Subscribed' : 'Subscribe';
            fetch('/api/video/1/subscribe', { method: 'POST' });
        }
        function postComment() {
            let input = document.getElementById('commentInput');
            if(!input.value.trim()) return;
            let list = document.getElementById('commentList');
            let div = document.createElement('div');
            div.className = 'comment-item';
            div.innerHTML = '<strong>You • Just now</strong>' + input.value;
            list.prepend(div);
            fetch('/api/video/1/comments', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({comment: input.value})
            });
            input.value = '';
        }
    </script>
</body>
</html>
