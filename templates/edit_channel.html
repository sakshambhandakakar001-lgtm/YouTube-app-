<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Channel</title>
    <style>
        body { background:#0f0f0f; color:#fff; font-family:sans-serif; margin:0; padding:16px; }
        .head { display:flex; align-items:center; gap:15px; margin-bottom:20px; }
        .head a { color:#fff; text-decoration:none; font-size:20px; }
        input { width:100%; padding:12px; background:#181818; border:1px solid #333; color:#fff; border-radius:8px; margin:8px 0 16px 0; box-sizing:border-box; }
        button { background:#3ea6ff; color:#000; border:none; padding:12px; width:100%; border-radius:20px; font-weight:bold; }
    </style>
</head>
<body>
    <div class="head"><a href="/yc">&#8592;</a><h3 style="margin:0;">Edit Channel</h3></div>
    <label>Name</label><input type="text" value="Saksham">
    <label>Handle</label><input type="text" value="@saksham">
    <label>Channel Description</label><input type="text" placeholder="Add channel description...">
    <button onclick="alert('Channel Updated!')">Save Changes</button>
</body>
</html>
