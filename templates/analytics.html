<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - Flixify Pro</title>
    <style>
        body { background:#0f0f0f; color:#fff; font-family:sans-serif; margin:0; padding:16px; }
        .head { display:flex; align-items:center; gap:15px; margin-bottom:20px; }
        .head a { color:#fff; text-decoration:none; font-size:20px; }
        .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .box { background:#181818; border:1px solid #282828; padding:15px; border-radius:10px; }
        .val { font-size:20px; font-weight:bold; margin-top:5px; color:#2ba640; }
    </style>
</head>
<body>
    <div class="head"><a href="/yc">&#8592;</a><h3 style="margin:0;">Channel Analytics</h3></div>
    <div class="grid">
        <div class="box"><span style="font-size:12px;color:#aaa;">SUBSCRIBERS</span><div class="val" style="color:#fff;">1,250</div></div>
        <div class="box"><span style="font-size:12px;color:#aaa;">EST. REVENUE</span><div class="val">,200.50</div></div>
        <div class="box"><span style="font-size:12px;color:#aaa;">VIEWS (28D)</span><div class="val" style="color:#fff;">11.4K</div></div>
        <div class="box"><span style="font-size:12px;color:#aaa;">WATCH TIME</span><div class="val" style="color:#fff;">342 Hrs</div></div>
    </div>
</body>
</html>
