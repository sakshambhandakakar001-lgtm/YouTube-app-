<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shorts - Flixify Pro</title>
    <style>
        body { background: #000; color: #fff; font-family: Roboto, Arial, sans-serif; margin: 0; height: 100vh; overflow: hidden; }
        .short-container { height: calc(100vh - 60px); width: 100%; position: relative; background: #111; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .overlay { position: absolute; bottom: 20px; left: 16px; z-index: 10; right: 70px; }
        .channel-name { font-weight: bold; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
        .short-title { font-size: 14px; margin: 0; }
        .side-actions { position: absolute; right: 12px; bottom: 30px; display: flex; flex-direction: column; gap: 20px; align-items: center; z-index: 10; }
        .side-btn { background: rgba(0,0,0,0.4); border: none; color: #fff; width: 45px; height: 45px; border-radius: 50%; font-size: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #0f0f0f; display: flex; justify-content: space-around; padding: 8px 0; border-top: 1px solid #222; }
        .nav-item { color: #aaa; text-decoration: none; font-size: 10px; text-align: center; }
        .nav-item.active { color: #fff; }
    </style>
</head>
<body>
    <div class="short-container">
        <video controls autoplay loop src="/static/videos/sample.mp4"></video>
        <div class="overlay">
            <div class="channel-name">@MOG_BOY_ <button style="background:red; color:#fff; border:none; padding:4px 10px; border-radius:12px; font-size:11px;">Subscribe</button></div>
            <p class="short-title">Minecraft Trap Challenge! 🔥 #shorts #gaming</p>
        </div>
        <div class="side-actions">
            <button class="side-btn">👍<span style="font-size:9px;">2.4K</span></button>
            <button class="side-btn">👎<span style="font-size:9px;">Dislike</span></button>
            <button class="side-btn">💬<span style="font-size:9px;">48</span></button>
            <button class="side-btn">↪<span style="font-size:9px;">Share</span></button>
        </div>
    </div>
    <div class="nav-bar">
        <a href="/" class="nav-item"><span>🏠</span>Home</a>
        <a href="/shorts" class="nav-item active"><span>⚡</span>Shorts</a>
        <a href="/upload" class="nav-item"><span>➕</span>Create</a>
        <a href="/community" class="nav-item"><span>💬</span>Community</a>
        <a href="/you" class="nav-item"><span>👤</span>You</a>
    </div>
</body>
</html>
