        .profile-header { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }

        .card-sm video, .card-sm img { width: 140px; height: 80px; border-radius: 8px; background: #222; object-fit: cover; }
        .card-sm p { margin: 4px 0 0; font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .menu-list { display: flex; flex-direction: column; gap: 16px; margin-top: 20px; }
        .menu-item { display: flex; align-items: center; gap: 16px; text-decoration: none; color: #fff; font-size: 14px; }
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #0f0f0f; display: flex; justify-content: space-around; padding: 8px 0; border-top: 1px solid #222; }
        .nav-item { color: #aaa; text-decoration: none; font-size: 10px; text-align: center; }
        .nav-item.active { color: #fff; }
