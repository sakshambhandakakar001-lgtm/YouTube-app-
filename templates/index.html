<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flixify Pro</title>
    <style>
        body { background: #0f0f0f; color: #fff; font-family: sans-serif; margin: 0; padding-bottom: 70px; }
        .header { padding: 12px 16px; background: #0f0f0f; border-bottom: 1px solid #272727; display: flex; align-items: center; justify-content: space-between; }
        .logo { color: red; font-size: 20px; font-weight: bold; text-decoration: none; }
        .categories { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; }
        .cat-btn { background: #272727; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-size: 13px; white-space: nowrap; }
        .cat-btn.active { background: #fff; color: #000; font-weight: bold; }
        .video-feed { padding: 10px; }
        .video-card { margin-bottom: 20px; background: #181818; border-radius: 12px; overflow: hidden; }
        .thumb-box { width: 100%; height: 210px; background: #000; position: relative; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .thumb-box img { width: 100%; height: 100%; object-fit: cover; }
        .play-icon { position: absolute; width: 50px; height: 50px; background: rgba(0,0,0,0.7); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #fff; }
        .video-info { padding: 12px; }
        .video-title { font-size: 15px; font-weight: 600; color: #f1f1f1; margin-bottom: 4px; }
        .video-meta { font-size: 12px; color: #aaa; }
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 56px; background: #0f0f0f; border-top: 1px solid #272727; display: flex; justify-content: space-around; align-items: center; }
        .nav-item { color: #aaa; text-decoration: none; font-size: 11px; text-align: center; }
        .nav-item.active { color: #fff; }
    </style>
</head>
<body>

    <div class="header">
        <a href="/" class="logo">Flixify Pro</a>
    </div>

    <div class="categories">
        <a href="/" class="cat-btn {% if not current_cat %}active{% endif %}">All</a>
        <a href="/?cat=Gaming" class="cat-btn {% if current_cat == 'Gaming' %}active{% endif %}">Gaming</a>
        <a href="/?cat=Music" class="cat-btn {% if current_cat == 'Music' %}active{% endif %}">Music</a>
        <a href="/?cat=Entertainment" class="cat-btn {% if current_cat == 'Entertainment' %}active{% endif %}">Entertainment</a>
    </div>

    <div class="video-feed">
        {% for v in videos %}
        {% set ytid = get_yt_id(v['filename']) %}
        <div class="video-card">
            <div class="thumb-box" id="box-{{ v['id'] }}" onclick="playVideo('{{ v['id'] }}', '{{ ytid }}')">
                <img src="https://img.youtube.com/vi/{{ ytid }}/hqdefault.jpg" onerror="this.src='https://via.placeholder.com/360x210?text=No+Thumbnail'">
                <div class="play-icon">▶</div>
            </div>
            <div class="video-info">
                <div class="video-title">{{ v['title'] }}</div>
                <div class="video-meta">{{ v['uploader'] }} • {{ v['views'] }} views • {{ v['category'] }}</div>
            </div>
        </div>
        {% else %}
        <p style="text-align:center; color:#888; margin-top:40px;">No videos available.</p>
        {% endfor %}
    </div>

    <div class="nav-bar">
        <a href="/" class="nav-item active">Home</a>
        <a href="/shorts" class="nav-item">Shorts</a>
        <a href="/upload" class="nav-item">+</a>
        <a href="/community" class="nav-item">Community</a>
        <a href="/you" class="nav-item">You</a>
    </div>

    <script>
        function playVideo(id, ytid) {
            var box = document.getElementById('box-' + id);
            box.innerHTML = '<iframe src="https://www.youtube.com/embed/' + ytid + '?autoplay=1" style="width:100%; height:100%; border:none;" allow="autoplay" allowfullscreen></iframe>';
        }
    </script>
</body>
</html>
